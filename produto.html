<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecionando | Grupo DDM</title>
  <link rel="stylesheet" href="./styles.css?v=20260901p">
</head>
<!-- Compatibilidade: cada produto agora tem a própria página estática
     (produto-<slug>.html). Links antigos no formato produto.html?produto=<slug>
     continuam funcionando por aqui. -->
<body class="product-detail-page">
  <main class="detail-final">
    <span>GRUPO DDM</span>
    <h2 id="redirectMessage">Levando você para a página do produto…</h2>
    <p class="product-lead">
      Se nada acontecer, escolha o produto abaixo.
    </p>
    <ul class="redirect-list">
      <li><a href="./produto-callia.html">Call IA</a></li>
      <li><a href="./produto-whatsapp.html">Call IA WhatsApp</a></li>
      <li><a href="./produto-lembretes.html">Agente de Lembretes</a></li>
      <li><a href="./produto-qualiddm.html">QualiDDM</a></li>
      <li><a href="./produto-creator.html">Creator</a></li>
      <li><a href="./produto-dashboard.html">Dashboard Creator</a></li>
      <li><a href="./produto-leads.html">Extrator de Leads</a></li>
      <li><a href="./produto-crm.html">Omni CRM</a></li>
      <li><a href="./produto-mail.html">Mail IA</a></li>
      <li><a href="./produto-labs.html">DDM Labs</a></li>
    </ul>
    <a class="button primary" href="./index.html#produtos">Ver todos os produtos ↗</a>
  </main>

  <script>
    (function () {
      var slugs = [
        "callia", "whatsapp", "lembretes", "qualiddm", "creator",
        "dashboard", "leads", "crm", "mail", "labs"
      ];
      var requested = new URLSearchParams(window.location.search).get("produto");
      var target = slugs.indexOf(requested) === -1 ? "callia" : requested;
      window.location.replace("./produto-" + target + ".html");
    })();
  </script>
</body>
</html>
